name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  builds:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build SpatialAudio.Tests/SpatialAudio.Tests.csproj -c Release
      - run: dotnet test SpatialAudio.Tests/SpatialAudio.Tests.csproj -c Release --no-build